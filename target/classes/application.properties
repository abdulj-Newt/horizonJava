# I have commented out the Oracle database properties and added the ones for PostgreSQL.
# Please update the URL, username, and password for your PostgreSQL instance.

spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=system
spring.datasource.password=oracle
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=none
server.port=8083
# Disable automatic SQL initialization to avoid conflicts
spring.sql.init.mode=never

